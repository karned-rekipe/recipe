name: TechDocs

on:
  pull_request:
    branches: [main]
    paths: [".github/workflows/techdocs.yml", "catalog-info.yaml", "docs/**", "mkdocs.yml"]
  push:
    branches: [main]
    paths: [".github/workflows/techdocs.yml", "catalog-info.yaml", "docs/**", "mkdocs.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  TECHDOCS_CLI_VERSION: "1.15.0"
  MKDOCS_TECHDOCS_CORE_VERSION: "1.7.1"
  TECHDOCS_ENTITY: default/Component/rekipe-recipe

jobs:
  validate:
    name: Validate MkDocs and links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with: {python-version: "3.13"}
      - run: python -m pip install "mkdocs-techdocs-core==${MKDOCS_TECHDOCS_CORE_VERSION}"
      - run: mkdocs build --strict --site-dir /tmp/techdocs-validation
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --offline './docs/**/*.md' './README.md'
          fail: true

  publish:
    name: Generate and publish
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {contents: read, id-token: write}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with: {node-version: "24"}
      - uses: actions/setup-python@v7.1.0
        with: {python-version: "3.13"}
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.TECHDOCS_PUBLISHER_SERVICE_ACCOUNT }}
      - run: python -m pip install "mkdocs-techdocs-core==${MKDOCS_TECHDOCS_CORE_VERSION}"
      - run: npx --yes "@techdocs/cli@${TECHDOCS_CLI_VERSION}" generate --no-docker --source-dir . --output-dir ./site --etag "${GITHUB_SHA}"
      - run: npx --yes "@techdocs/cli@${TECHDOCS_CLI_VERSION}" publish --publisher-type googleGcs --storage-name "${{ vars.TECHDOCS_BUCKET }}" --entity "${TECHDOCS_ENTITY}" --directory ./site --skip-if-unchanged
